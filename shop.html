<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Lara Koro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(80vw, 1200px);
      margin: 0 auto;
    }

    header {
      padding-top: 38px;
      padding-bottom: 72px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-left {
      display: flex;
      gap: 34px;
      justify-self: start;
      align-items: center;
    }

    .nav-left a {
      font-family: Oswald, Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #d8d8d8;
    }

    .nav-left a:hover {
      color: #fff;
    }

    .site-title {
      justify-self: center;
      font-family: Oswald, Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .social-right {
      justify-self: end;
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .social-right a {
      font-family: Oswald, Arial, sans-serif;
      font-size: 18px;
      color: #d8d8d8;
      text-transform: uppercase;
    }

    .social-right a:hover {
      color: #fff;
    }

    .shop {
      padding: 20px 0 60px;
    }

    .shop h1 {
      font-family: Oswald, Arial, sans-serif;
      font-size: 28px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .shop-item img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .shop-item h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .shop-item p {
      font-size: 14px;
      color: #d7d7d7;
      margin-bottom: 12px;
    }

    .shop-button {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #fff;
      border-radius: 999px;
      font-size: 13px;
      text-transform: uppercase;
    }

    .shop-button:hover {
      background: #fff;
      color: #000;
    }

    .size-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 16px;
}
    
.shop-placeholder {
  width: 100%;
  aspect-ratio: 1 / 1;
  border: 1px solid #333;
  border-radius: 4px;
  display: grid;
  place-items: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 12px;
}
    
    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        row-gap: 20px;
      }

      .nav-left,
      .site-title,
      .social-right {
        justify-self: center;
      }

      .shop-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="topbar">
        <nav class="nav-left">
          <a href="index.html">Work</a>
          <a href="shop.html">Shop</a>
          <a href="index.html#contact">About & Contact</a>
        </nav>

        <div class="site-title">Lara Koro</div>

        <div class="social-right">
          <a href="#">Tw</a>
          <a href="#">Be</a>
          <a href="#">Ig</a>
        </div>
      </div>
    </header>

    <main class="shop">
      <h1>Shop</h1>

      <div class="shop-grid">
<!-- shop cards -->
        <div class="shop-item">
          <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1200&q=80" alt="Print 1">
          <h3>Charcoal Flower Girl Print</h3>
          <p>$25</p>
          <a href="https://buy.stripe.com/3cI4gA3eHaGa4AW8oZffy00" target="_blank" class="shop-button">
  Buy Print
</a>
        </div>

     <div class="shop-item">
  <div class="shop-placeholder">Image coming soon</div>
  <h3>Charcoal Flower Girl</h3>
  <p>Signed poster</p>

  <div class="size-options">
    <a href="LINK-8x10" target="_blank" class="shop-button">8x10 — $15</a>
    <a href="LINK-11x14" target="_blank" class="shop-button">11x14 — $20</a>
    <a href="LINK-16x20" target="_blank" class="shop-button">16x20 — $30</a>
  </div>
</div>
        
<div class="shop-item">
  <div class="shop-placeholder">Image coming soon</div>
  <h3>Charcoal Flower Girl</h3>
  <p>Choose a size:</p>

  <div class="size-options">
    <a href="LINK-8x10" target="_blank" class="size-link">8x10</a>
    <a href="LINK-11x14" target="_blank" class="size-link">11x14</a>
    <a href="LINK-16x20" target="_blank" class="size-link">16x20</a>
  </div>

  <p class="from-price">From $15</p>
</div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
