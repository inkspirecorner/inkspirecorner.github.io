<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lara Koro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(92vw, 1680px);
      margin: 0 auto;
    }

    header {
      padding-top: 38px;
      padding-bottom: 72px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-left {
      display: flex;
      gap: 34px;
      justify-self: start;
      align-items: center;
    }

    .nav-left a {
      font-family: Oswald, Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #d8d8d8;
    }

    .nav-left a:hover {
      color: #fff;
    }

    .site-title {
      justify-self: center;
      font-family: Oswald, Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .social-right {
      justify-self: end;
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .social-right a {
      font-family: Oswald, Arial, sans-serif;
      font-size: 18px;
      color: #d8d8d8;
      text-transform: uppercase;
    }

    .social-right a:hover {
      color: #fff;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #000;
    }

    .portfolio-item {
      background: #111;
      overflow: hidden;
    }

    .portfolio-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .portfolio-item video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform 0.35s ease;
}
    
    .portfolio-item:hover img {
      transform: scale(1.02);
    }

    .portfolio-item:hover video {
  transform: scale(1.02);
}
    
    .portfolio-item.landscape {
      aspect-ratio: 1.72 / 1;
    }

    .contact {
      padding: 80px 0 60px;
    }

    .contact h2 {
      font-family: Oswald, Arial, sans-serif;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .contact p,
    .contact a {
      font-size: 16px;
      color: #d7d7d7;
      line-height: 1.7;
    }

    .contact a:hover {
      color: #fff;
    }

    @media (max-width: 1100px) {
      .site-title {
        font-size: 28px;
      }

      .nav-left a,
      .social-right a {
        font-size: 14px;
      }
    }

    @media (max-width: 820px) {
      header {
        padding-top: 28px;
        padding-bottom: 42px;
      }

      .topbar {
        grid-template-columns: 1fr;
        row-gap: 20px;
      }

      .nav-left,
      .site-title,
      .social-right {
        justify-self: center;
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
      }

      .portfolio-item.landscape {
        aspect-ratio: 1.5 / 1;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(94vw, 1680px);
      }

      .nav-left {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .social-right {
        gap: 16px;
      }

      .site-title {
        font-size: 24px;
      }

      .nav-left a,
      .social-right a {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="topbar">
        <nav class="nav-left">
          <a href="#work">Work</a>
          <a href="#contact">About & Contact</a>
        </nav>

        <div class="site-title">Lara Koro</div>

        <div class="social-right">
          <a href="#">Tw</a>
          <a href="#">Be</a>
          <a href="#">Ig</a>
        </div>
      </div>
    </header>

    <main>
      <section id="work" class="portfolio-grid">
        <div class="portfolio-item landscape">
          <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1600&q=80" alt="">
        </div>

        <div class="portfolio-item landscape">
          <img src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1600&q=80" alt="">
        </div>

        <div class="portfolio-item landscape">
          <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?auto=format&fit=crop&w=1600&q=80" alt="">
        </div>

       <div class="portfolio-item landscape">
  <video autoplay muted loop playsinline>
    <source src="videos/my-video.mp4" type="video/mp4">
  </video>
</div>
      </section>

      <section id="contact" class="contact">
        <h2>About & Contact</h2>
        <p>Lara koro is a visual designer and photographer creating clean, minimal work.</p>
        <p>Email: <a href="mailto:hello@laradavis.com">hello@larakoro.com</a></p>
      </section>
    </main>
  </div>
</body>
</html>
